name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # MLX requires Apple Silicon; GitHub's macOS runners are arm64 from macos-14 on.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # "latest-stable" resolves to the runner's marked default (16.4, Swift
          # tools 6.2.4) rather than the newest Xcode actually installed on the
          # image -- mlx-swift 0.32.3 needs Swift tools 6.3.0, so pin explicitly
          # to the newest preinstalled Xcode instead.
          xcode-version: "26.3"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        # swift-testing runs @Test funcs concurrently by default regardless of this
        # being a single SwiftPM invocation; several tests assert on wall-clock
        # timing windows that CPU contention from concurrent tests can blow past.
        # --no-parallel serializes execution so those windows are reliable.
        run: swift test --no-parallel
